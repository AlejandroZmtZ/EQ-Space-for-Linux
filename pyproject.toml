[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqspace"
version = "0.1.0"
description = "EQ-Space for Linux — parametric equalizer for PipeWire"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.scripts]
eqspace = "eqspace.app:main"

[tool.setuptools.packages.find]
where = ["src"]
